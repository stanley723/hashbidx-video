[project]
name = "hashbidx-video"
description = "Generate video in ComfyUI with your own HashBidX API key: Seedance 2.5 / 2.0, MiniMax H3 and Wan 3.0. Text-to-video, first/last frame, references, extend and edit a clip, camera and look presets, multi-shot prompts, shot writer, image generation."
version = "0.6.1"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/stanley723/hashbidx-video"
Documentation = "https://hashbidx.ai/docs"

[tool.comfy]
PublisherId = "hashbidx"
DisplayName = "HashBidX Video (Seedance, MiniMax H3, Wan)"
Icon = "https://raw.githubusercontent.com/stanley723/hashbidx-video/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/stanley723/hashbidx-video/main/assets/banner.jpg"
requires-comfyui = ">=0.3.0"
